<section class="section skills" id="skills">
  <div class="container">
    <div class="skills__head" appReveal>
      <p class="eyebrow">{{ i18n.t('skills.eyebrow') }}</p>
      <h2 class="section-title">{{ i18n.t('skills.title') }}</h2>
      <p class="section-lead">{{ i18n.t('skills.lead') }}</p>
    </div>

    <div class="skills__grid">
      @for (group of groups; track i; let i = $index) {
        <div class="skill-card" appReveal>
          <div class="skill-card__head">
            <span class="skill-card__index">{{ '0' + (i + 1) }}</span>
            <h3 class="skill-card__title">{{ group.label[i18n.lang()] }}</h3>
          </div>
          <ul class="skill-card__list">
            @for (item of group.items; track item) { <li>{{ item }}</li> }
          </ul>
        </div>
      }
    </div>
  </div>
</section>
