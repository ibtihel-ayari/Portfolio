<section class="section about" id="about">
  <div class="container about__grid">
    <div class="about__intro" appReveal>
      <p class="eyebrow">{{ i18n.t('about.eyebrow') }}</p>
      <h2 class="section-title">
        {{ i18n.t('about.title1') }} <span class="grad-text">{{ i18n.t('about.titleGrad') }}</span>
      </h2>
      <p class="about__text">{{ i18n.t('about.p1') }}</p>
      <p class="about__text">{{ i18n.t('about.p2') }}</p>
      <a href="/cv.pdf" class="btn btn--ghost" download>{{ i18n.t('about.cv') }}</a>
    </div>

    <div class="about__stats" appReveal>
      @for (stat of stats; track stat.key) {
        <div class="stat glass">
          <span class="stat__value grad-text">{{ stat.value }}</span>
          <span class="stat__label">{{ i18n.t(stat.key) }}</span>
        </div>
      }
    </div>
  </div>
</section>
