<header class="header" [class.header--scrolled]="scrolled()">
  <div class="container header__inner">
    <a href="#top" class="brand" (click)="closeMenu()">
      <span class="brand__mark">IB</span>
      <span class="brand__name">Ibtihel</span>
    </a>

    <!-- La classe nav--open dépend du signal menuOpen() -->
    <nav class="nav" [class.nav--open]="menuOpen()">
      @for (link of links; track link.href) {
        <a [href]="link.href" class="nav__link" (click)="closeMenu()">{{ link.label }}</a>
      }
    </nav>

    <div class="header__actions">
      <!-- Bouton thème : on lit theme.theme() et on appelle theme.toggle() -->
      <button class="icon-btn" type="button" (click)="theme.toggle()"
        [attr.aria-label]="theme.theme() === 'dark' ? 'Mode clair' : 'Mode sombre'">
        @if (theme.theme() === 'dark') {
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z" />
          </svg>
        }
      </button>

      <button class="burger" type="button" (click)="toggleMenu()"
              [class.burger--open]="menuOpen()" aria-label="Menu">
        <span></span><span></span>
      </button>
    </div>
  </div>
</header>
